name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.27"]
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet -v ./...
      - name: Unit tests
        run: go test -v -timeout 2m -failfast ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27"
          cache: true
      - name: Check formatting
        run: |
          unformatted="$(git ls-files -z '*.go' ':!:vendor/' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - name: Install staticcheck
        env:
          GOFLAGS: ""
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1 # 2026.1.1; 2026.1 cannot read Go 1.27 export data
      - name: Staticcheck
        run: |
          staticcheck ./...
          staticcheck -tags=integration ./cmd/...
          staticcheck -tags=smokescreen_no_prometheus ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27"
          cache: true
      - name: Race tests
        run: go test -race -v -timeout 2m -failfast ./...

  no-prometheus:
    name: No Prometheus build
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27"
          cache: true
      - name: Test without Prometheus
        run: go test -race -v -timeout 2m -failfast -tags=smokescreen_no_prometheus ./...
      - name: Verify Prometheus is excluded from dependencies
        run: |
          if go list -deps -tags=smokescreen_no_prometheus ./... | grep -q '^github.com/prometheus/'; then
            echo "Prometheus packages are present in the no-Prometheus dependency graph"
            exit 1
          fi

  integration:
    name: Hermetic integration tests
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27"
          cache: true
      - name: Integration tests
        run: go test -race -v -timeout 2m -failfast -tags=integration ./cmd/...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27"
          cache: true
      - name: Generate coverage
        run: go test -v -timeout 2m -failfast -covermode atomic -coverprofile=.covprofile ./...
      - name: Install goveralls
        env:
          GOFLAGS: ""
        run: go install github.com/mattn/goveralls@v0.0.12
      - name: Send coverage
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goveralls -coverprofile=.covprofile -service=github

  vendor:
    name: Verify vendored dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27"
          cache: true
      - name: Check vendor tree
        run: |
          go mod vendor
          # Porcelain status also catches newly vendored files that were never committed.
          if [ -n "$(git status --porcelain -- go.mod go.sum vendor/)" ]; then
            git status --short -- go.mod go.sum vendor/
            echo "Run 'go mod vendor' and commit the result"
            exit 1
          fi
